# Every top-level key is a state, except "Task" which lists the task sequences.
#
# A state declares enter / progress / exit + id.
#   "default"  -> the default callback of that field (default_enter, default_exit,
#                 default_progress), all of them empty
#   <any name> -> a callback from custom_callbacks.py, e.g. custom_A. Names are
#                 resolved in CALLBACK_MAP AT RUNTIME, so registering a callback
#                 after startup still works.
#
# Task: each task is one chain, Start and End are added automatically:
#           Start -> [sequence] -> End -> Start
#       A state may appear only once per sequence. Start / End / Cancel must be
#       declared as states but must not be listed in a sequence.
Start:
  enter: start_enter
  progress: start_progress
  exit: start_exit
  id: 1
End:
  enter: end_enter
  progress: end_progress
  exit : end_exit
  id : 0
Cancel:
  enter: cancel_enter
  progress: cancel_progress
  exit: cancel_exit
  id: -1
Pick:
  enter: default
  progress: default
  exit: default
  id: 2
Place:
  enter: default
  progress: default
  exit: default
  id: 3
Drop :
  enter: default
  progress: default
  exit : default
  id: 4

Task :
  Normal :
    sequence : [Pick , Place  , Drop]
  Normal2 :
    sequence : [Place, Pick , Drop ]
  Normal3 :
    sequence : [Drop , Pick ]

Ros2_bag :
  Topic : [/cam_head/cam_head/color/image_raw ,
    /cam_left/cam_left/color/image_raw ,
    /cam_right/cam_right/color/image_raw ,
    /left_joint_trajectory_controller/controller_state ,
    /left_joint_trajectory_controller/joint_trajectory ,
    /left_revo2_hand_controller/controller_state ,
    /left_revo2_hand_controller/joint_trajectory ,
    /right_joint_trajectory_controller/controller_state ,
    /right_joint_trajectory_controller/joint_trajectory ,
    /right_revo2_hand_controller/controller_state ,
    /right_revo2_hand_controller/joint_trajectory ,
    /tf ,
    /tf_static ,
    /vr_buttons ,
    /left_ee_pose ,
    /right_ee_pose]
  path : ~/data/real
